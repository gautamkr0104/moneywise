[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moneywise"
version = "0.1.0"
description = "A production-quality personal finance management application built with Flask."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "MoneyWise" }]
keywords = ["finance", "flask", "personal-finance", "budget"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Flask",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
]
dependencies = [
    "Flask>=3.1,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-Migrate>=4.0,<5",
    "Flask-WTF>=1.2,<2",
    "WTForms>=3.1,<4",
    "pydantic>=2.10,<3",
    "pandas>=2.2,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-flask>=1.3,<2",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # allow Flask/WTForms style deferred-call decorators (e.g. @login_required)
